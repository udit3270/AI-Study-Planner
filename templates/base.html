{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI Study Planner
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/main.css' %}"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <nav>

        <div class="logo">
            🚀 AI Study Planner
        </div>

        <div class="nav-links">

            <a href="{% url 'dashboard' %}">
                Dashboard
            </a>

            <a href="{% url 'ai_schedule' %}">
                AI Planner
            </a>

            <a href="{% url 'pomodoro' %}">
                Pomodoro
            </a>

            <a href="{% url 'note_list' %}">
                Notes
            </a>

            {% if user.is_authenticated %}

                <a href="{% url 'logout' %}">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

                <a href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </nav>

    {% if messages %}

        <div class="messages">

            {% for message in messages %}

                <div class="alert">

                    {{ message }}

                </div>

            {% endfor %}

        </div>

    {% endif %}

    {% block content %}
    {% endblock %}

</body>

</html>
